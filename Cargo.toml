[package]
name = "blast"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4.12.1", features = ["actix-tls", "openssl", "secure-cookies"] }
clap = { version = "4.5.53", features = ["derive"] }
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
tokio = { version = "1.48.0", features = ["macros"] }
toml = "0.9.10"
